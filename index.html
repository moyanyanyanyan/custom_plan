<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hackson - 新项目筹备中</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      background: white;
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 90%;
    }
    h1 {
      color: #333;
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }
    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .status {
      display: inline-block;
      background: #e3f2fd;
      color: #1976d2;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
    .repo-link {
      display: inline-block;
      margin-top: 2rem;
      color: #1976d2;
      text-decoration: none;
      border: 1px solid #1976d2;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      transition: all 0.3s;
    }
    .repo-link:hover {
      background: #1976d2;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 hackson</h1>
    <p>一个新项目正在筹备中。<br>项目详情、功能规划与技术栈将随后续讨论确定。</p>
    <div class="status">项目状态：筹备中</div>
    <a href="https://gitee.com/moyanyanyanyan/hackson" class="repo-link" target="_blank">查看仓库</a>
  </div>
</body>
</html>
