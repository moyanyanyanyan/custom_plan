<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杭电社团推荐 - 找到你的兴趣社团</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      padding: 40px 20px;
      color: white;
    }
    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .section-title {
      font-size: 1.3em;
      font-weight: 600;
      margin-bottom: 15px;
      color: #444;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tag {
      padding: 10px 20px;
      border: 2px solid #667eea;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s;
      background: white;
      color: #667eea;
      font-size: 1em;
      user-select: none;
    }
    .tag:hover {
      background: #f0f0ff;
      transform: translateY(-2px);
    }
    .tag.selected {
      background: #667eea;
      color: white;
      transform: scale(1.05);
    }
    .button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s;
      display: block;
      margin: 20px auto;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    .button:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }
    .results {
      display: none;
      margin-top: 30px;
    }
    .results.show {
      display: block;
      animation: fadeIn 0.5s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .club-card {
      background: #f8f9ff;
      border-left: 4px solid #667eea;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      transition: all 0.3s;
    }
    .club-card:hover {
      transform: translateX(5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .club-name {
      font-size: 1.3em;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 8px;
    }
    .club-desc {
      color: #666;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .match-reason {
      background: #fff;
      border-left: 3px solid #764ba2;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 0.95em;
      color: #555;
    }
    .match-label {
      font-weight: 600;
      color: #764ba2;
      margin-right: 5px;
    }
    .action-button {
      background: white;
      border: 2px solid #667eea;
      color: #667eea;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.95em;
      margin-right: 10px;
    }
    .action-button:hover {
      background: #667eea;
      color: white;
    }
    .matched-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .matched-label {
      font-weight: 600;
      color: #764ba2;
      font-size: 0.95em;
    }
    .tag.matched {
      padding: 4px 12px;
      border-radius: 14px;
      background: #eef2ff;
      color: #667eea;
      border: 1px solid #667eea;
      font-size: 0.9em;
    }
    .error-msg {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
      display: none;
    }
    .error-msg.show {
      display: block;
    }
    .footer {
      text-align: center;
      padding: 20px;
      color: white;
      opacity: 0.8;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 入口区 -->
    <div class="header">
      <h1>🎓 杭电社团推荐</h1>
      <p>选择你的兴趣，我们帮你找到最适合的社团</p>
    </div>

    <!-- 操作区 -->
    <div class="card">
      <div class="section-title">✨ 选择你的兴趣标签（可多选）</div>
      <div class="tags" id="tags"></div>
      <button class="button" id="recommendBtn" onclick="generateRecommendations()">
        🚀 生成推荐
      </button>
      <div class="error-msg" id="errorMsg">请至少选择 1 个兴趣标签</div>
    </div>

    <!-- 结果区 -->
    <div class="card results" id="results">
      <div class="section-title">🎯 为你推荐的社团</div>
      <div id="clubList"></div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
      © 2025 杭电社团推荐平台 · 数据来源：杭电社团官网
    </div>
  </div>

  <script>
    // 社团数据库（demo 数据，可根据官网更新）
    const clubs = [
      {
        id: 1,
        name: "计算机协会",
        tags: ["编程", "技术", "人工智能", "竞赛"],
        desc: "杭电最具影响力的技术社团之一，定期举办编程 workshops、黑客松和 AI 讲座。",
        contact: "QQ群：123456789",
        reason: "你对编程和技术有浓厚兴趣，这里有你需要的实战项目和志同道合的伙伴。"
      },
      {
        id: 2,
        name: "摄影协会",
        tags: ["摄影", "艺术", "设计", "创作"],
        desc: "用镜头记录校园生活，定期组织外拍、摄影展和后期教程。",
        contact: "微信：photo_hdu",
        reason: "你对视觉创作感兴趣，摄影协会能帮你提升审美和技术，还能认识很多有趣的人。"
      },
      {
        id: 3,
        name: "机器人协会",
        tags: ["机器人", "技术", "竞赛", "工程"],
        desc: "参加 RoboMaster、机器人竞赛，动手实践嵌入式开发和机械设计。",
        contact: "邮箱：robot@hdu.edu.cn",
        reason: "你对机器人和工程技术感兴趣，这里有完整的实验室和比赛机会。"
      },
      {
        id: 4,
        name: "街舞协会",
        tags: ["街舞", "表演", "艺术", "运动"],
        desc: "涵盖 Hip-hop、Popping、Breaking 等舞种，每周训练，年底举办专场演出。",
        contact: "公众号：HDU街舞社",
        reason: "你对舞蹈和表演感兴趣，街舞社氛围友好，能快速融入并展示自我。"
      },
      {
        id: 5,
        name: "青年志愿者协会",
        tags: ["志愿", "公益", "社交", "活动"],
        desc: "组织各类公益活动，支教、环保、社区服务，让大学生活更有意义。",
        contact: "QQ群：987654321",
        reason: "你关心社会公益，青协提供丰富的志愿机会和实践平台。"
      },
      {
        id: 6,
        name: "电竞社",
        tags: ["电竞", "游戏", "竞赛", "社交"],
        desc: "组织校内联赛、观赛活动和游戏开发 workshops，王者荣耀/LOL/CS2 等项目。",
        contact: "Discord：hdu-gaming",
        reason: "你对游戏和竞技感兴趣，电竞社不只是打游戏，还能学习赛事组织和内容创作。"
      },
      {
        id: 7,
        name: "人工智能协会",
        tags: ["人工智能", "编程", "技术", "科研"],
        desc: "深度学习、计算机视觉、NLP 前沿技术分享，Kaggle 竞赛集训。",
        contact: "公众号：HDU-AI",
        reason: "你对 AI 和前沿技术感兴趣，这里有最硬核的技术社区和项目机会。"
      },
      {
        id: 8,
        name: "音乐协会",
        tags: ["音乐", "表演", "艺术", "创作"],
        desc: "乐队、合唱、乐器培训，每月举办 live house 和音乐节。",
        contact: "微信：music_hdu",
        reason: "你对音乐有热情，音协提供舞台和乐队资源，让你的大学生活更动听。"
      }
    ];

    const allTags = [...new Set(clubs.flatMap(c => c.tags))].sort();

    // 渲染标签
    function renderTags() {
      const container = document.getElementById('tags');
      container.innerHTML = allTags.map(tag =>
        `<div class="tag" onclick="toggleTag(this, '${tag}')">${tag}</div>`
      ).join('');
    }

    let selectedTags = new Set();

    function toggleTag(el, tag) {
      if (selectedTags.has(tag)) {
        selectedTags.delete(tag);
        el.classList.remove('selected');
      } else {
        selectedTags.add(tag);
        el.classList.add('selected');
      }
    }

    // 生成推荐
    function generateRecommendations() {
      const errorMsg = document.getElementById('errorMsg');
      const results = document.getElementById('results');

      if (selectedTags.size === 0) {
        errorMsg.classList.add('show');
        return;
      }

      errorMsg.classList.remove('show');

      // 计算匹配分数
      const scored = clubs.map(club => {
        const matchCount = club.tags.filter(t => selectedTags.has(t)).length;
        return { ...club, score: matchCount };
      }).filter(c => c.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);

      // 渲染结果
      const list = document.getElementById('clubList');
      if (scored.length === 0) {
        list.innerHTML = '<p style="text-align:center;color:#666;">暂无匹配社团，试试其他标签吧～</p>';
      } else {
        list.innerHTML = scored.map(club => {
          const matchedTags = club.tags.filter(t => selectedTags.has(t));
          return `
            <div class="club-card">
              <div class="club-name">${club.name}</div>
              <div class="club-desc">${club.desc}</div>
              <div class="match-reason">
                <span class="match-label">💡 推荐理由：</span>
                ${club.reason}
              </div>
              <div class="matched-tags">
                <span class="matched-label">🏷️ 兴趣标签：</span>
                ${club.tags.map(t => `<span class="tag matched">${t}</span>`).join('')}
              </div>
              <div style="margin-top: 10px;">
                <button class="action-button" onclick="alert('联系方式：${club.contact}')">
                  📞 联系社团
                </button>
                <button class="action-button" onclick="alert('报名功能即将上线，敬请期待！')">
                  📝 立即报名
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      results.classList.add('show');
      results.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 初始化
    renderTags();
  </script>
</body>
</html>
